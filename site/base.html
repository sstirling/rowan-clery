<script>
/* Set the theme before first paint. Without this the page renders light, then flips —
   which with three pages would mean a flash on every navigation.

   It also resolves "follow the system" into an explicit data-theme attribute, so the
   stylesheet needs only one dark block instead of repeating every token in a
   prefers-color-scheme media query as well. lib.js keeps it in step if the OS theme
   changes while the page is open and the reader has not chosen for themselves. */
(function () {
  var t;
  try { t = localStorage.getItem("theme"); } catch (e) { t = null; }
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
