.rail {

const deck = document.getElementById("deck");
SLIDES.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide" + (s.dark ? " dark" : "") + (i === 0 ? " on" : "");
  el.innerHTML = s.html;
  deck.appendChild(el);
});

const els = Array.from(document.querySelectorAll(".slide"));
const notesEl = document.getElementById("notes");
const numEl = document.getElementById("num");
const barEl = document.getElementById("bar");
let at = 0;
let notesOpen = false;

function paint() {
  els.forEach((el, i) => el.classList.toggle("on", i === at));
  numEl.textContent = at + 1;
  barEl.style.width = ((at + 1) / els.length * 100) + "%";
  notesEl.innerHTML = '<div class="hd">SPEAKER NOTES &middot; SLIDE ' + (at + 1) + '</div>' +
    SLIDES[at].notes.map((n) => "<p>" + n + "</p>").join("");
}
function go(n) { at = Math.max(0, Math.min(els.length - 1, n)); paint(); }

document.getElementById("prev").onclick = () => go(at - 1);
document.getElementById("next").onclick = () => go(at + 1);
document.getElementById("noteBtn").onclick = () => {
  notesOpen = !notesOpen;
  notesEl.hidden = !notesOpen;
};
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(at + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(at - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(els.length - 1);
  else if (e.key === "n" || e.key === "N") { notesOpen = !notesOpen; notesEl.hidden = !notesOpen; }
});

paint();
</script>
