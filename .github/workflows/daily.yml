name: Daily archive

# Twice a day on odd minutes. Scheduled workflows on shared runners are best-effort —
# delays of an hour are routine and runs are sometimes skipped entirely under load — so
# the second run is cheap insurance rather than redundancy. The content-hash gate means
# an unchanged source costs nothing.
on:
  schedule:
    - cron: "17 9 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# Never let a manual run race the cron and produce conflicting commits.
concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Drive's listing renders localized, year-less timestamps. Pinning the zone keeps
      # them comparable between runs.
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The pipeline is deliberately stdlib-only: no install step, nothing to pin, and
      # no supply-chain surface in a pipeline whose output is meant to be evidence.

      - name: Fetch and archive
        id: run
        run: |
          set -o pipefail
          set +e
          python run.py all 2>&1 | tee run.log
          code=$?
          set -e
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          # 0 = clean. 2 = completed, with alarms worth reading. BOTH leave a correctly
          # updated archive that has to be committed — exit 2 is how the archive reports
          # a source file being withdrawn, which is the whole point of the project.
          # 1 and 3 mean the archive was NOT updated, and those do stop the run.
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 2 ]; then
            echo "::error::run.py exited ${code} — the archive was not updated"
            exit "${code}"
          fi
          if [ "${code}" -eq 2 ]; then
            echo "::warning::The run raised alarms. The archive is still being committed."
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Rowan Clery archive — $(date -u +%Y-%m-%d)"
            echo '```'
            cat run.log || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every page renders
        run: |
          # A JavaScript error produces a page that serves HTTP 200 with every chart
          # empty. Catch it here rather than in the browser. Every page is checked:
          # verifying only the overview let the other two ship unexamined.
          for page in docs/index.html docs/changes.html docs/about.html; do
            node tests/run_page.mjs "$page"
          done

      - name: Verify raw evidence was only added to
        run: python scripts/verify_raw_integrity.py

      - name: Commit
        run: |
          git config user.name  "rowan-clery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          summary=$(python -c "import json,pathlib; r=sorted(pathlib.Path('data/raw/_runs').glob('*.json')); print(json.loads(r[-1].read_text()).get('summary','updated') if r else 'updated')")
          # A commit per run, change or not, serves two purposes: git log becomes a
          # human-readable audit trail, and the repository stays active. GitHub disables
          # scheduled workflows after 60 days without commits, and because snapshots are
          # written only on change, a quiet stretch would otherwise switch the scraper
          # off silently — exactly when nobody would notice.
          git commit -m "data: ${summary} — $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git push && break
            echo "push failed, rebasing (attempt $attempt)"
            git pull --rebase
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Report alarms or failure as an issue
        # Runs for a hard failure OR for exit 2 (archive fine, something needs a human).
        # continue-on-error so a permissions problem here can never mask the real outcome
        # — which is exactly what happened on 2026-10-03.
        if: always() && (failure() || steps.run.outputs.exit == '2')
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          RUN_EXIT: ${{ steps.run.outputs.exit }}
        with:
          script: |
            const alarmed = process.env.RUN_EXIT === "2";
            const today = new Date().toISOString().slice(0, 10);
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Separate labels, so an alarm and a real failure never dedupe into each
            // other and quietly hide one of the two.
            const label = alarmed ? "source-change" : "scrape-failure";
            const title = alarmed ? "Source change needs review" : "Scrape failure";

            const body = alarmed
              ? `The daily archive run on ${today} raised alarms.\n\n[View the run](${runUrl})\n\n` +
                `**The archive updated normally and has been committed.** An alarm means the source ` +
                `changed in a way worth a look — most often a file disappearing — not that anything ` +
                `went wrong in the pipeline. The run log lists which.`
              : `The daily archive run failed on ${today}.\n\n[View the run](${runUrl})\n\n` +
                `**The archive was not modified.** Nothing has been lost, but no new data is being ` +
                `captured until this is fixed.`;

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: label,
            });
            const match = open.data.find((i) => i.title.startsWith(title));
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `${title} — ${today}`, labels: [label], body,
              });
            }

  deploy:
    # Pages is deployed from the SAME workflow run. Commits made with GITHUB_TOKEN do
    # not trigger other workflows, so a separate `on: push` Pages job would never fire
    # and the page would silently freeze while the data kept updating.
    needs: archive
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
